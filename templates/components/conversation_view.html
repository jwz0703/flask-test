<style>
    .upload-zone {
            width: 100%;
            margin: 10px;
            min-height: 30dvh;
            padding: 30px 12px;
            border: var(--primary-color) solid 1px;
            color: var(--primary-color);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .upload-zone p {
            font-size: 16px;
            padding: 14px;
        }
        .upload-click-btn {
            width: 100%;
            padding: 8px 24px;
            font-size: 16px;
            border-radius: 980px;
            border: solid var(--primary-color) 1px;
            margin: 10px;
            cursor: pointer;
            background: transparent;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }
        .upload-click-btn:hover {
            background: var(--primary-color);
            color: white;
        }
        .upload-click-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .md-area {
            display: block;
            width: 100%;
        }
        .preview-grid {
            width: 100%;
            display: flex;
            
            overflow-x: auto;
            gap:8px;
            
            
        }
        .preview-grid::-webkit-scrollbar {
            display: none;
        }
        .preview-item {
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            width: 200px;
            border-radius: 16px;
            border: none; 
            border: 1px gray solid;
        }
        .preview-item img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            
        }
        .preview-del {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            border-radius: 100%;
            border: none;
            top: 8px;
            right: 8px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.436);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            box-shadow: 0 16px 48px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.06);
        }
        .extra-message {
            width: 100%;
            resize: none;
            min-height: 48px;
            font-size: 16px;
            border-radius: 16px;
            padding: 8px;
            border-color: var(--primary-color);
            overflow: hidden;
        }
        .upload-hint {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        details.thinking-zone {
            width: 100%;
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            margin-bottom: 4px;
            padding: 8px 12px;
        }
        details.thinking-zone summary {
            cursor: pointer;
            color: var(--primary-color);
            user-select: none;
            font-size: 16px;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details.thinking-zone summary::before {
            content: "🫪";
            font-size: 16px;
            transition: transform 0.2s;
        }
        details[open].thinking-zone summary::before {
            transform: rotate(90deg);
        }
</style>
<h1 style="font-size: 1rem;">想作弊喔</h1>
<div class="upload-zone" id="drop-zone" onclick= "$('fileInput').click()">
    <div id="uploadHint" class="upload-hint">
        <i class="fa-solid fa-upload""></i>
        <p >點擊上傳</p>
    </div>
    
    <div id="previewGrid" class = "preview-grid"></div>
</div>
<label for="extraMessage" style="display: none;">額外訊息</label>
<textarea name="extraMessage" id="extraMessage" placeholder="額外訊息..." class="extra-message" rows="4" cols="5"></textarea>

<button id="submitBtn" class="upload-click-btn">開始</button>
<input type="file" id="fileInput" accept="image/*" style="display: none;" multiple>
<details id="thinking-zone" class="thinking-zone" style="display: none;">
    <summary id="thinking-summary">思考過程</summary>
    <div id="thinking" class="thinking"></div>
</details>
<div id="content" class="md-area"></div>
<script>
    $ = id => document.getElementById(id);
    $('fileInput').addEventListener('change',function(){
        const files = $('fileInput').files;
        console.log(files);
        if(files.length > 0){
            addFiles(files);
        }
    });
    let selectFiles = [];
    function addFiles(files){
        for(const file of files){
            $('uploadHint').style.display = "none";
            if(!file.type.startsWith('image/')) continue;
            const url = URL.createObjectURL(file);
            const item = document.createElement('div');
            item.className = 'preview-item';
            item.innerHTML = `<img src="${url}" style="height:250px"><button class="preview-del">✕</button>`;
            item.querySelector('.preview-del').onclick = e =>{
                e.stopPropagation();
                URL.revokeObjectURL(url);
                selectFiles.splice(selectFiles.indexOf(file),1);
                if(selectFiles.length == 0){
                    $('uploadHint').style.display = "flex";
                } else {
                    console.log("hide");
                    $('uploadHint').style.display = "none";
                }
                item.remove();
                console.log(item);
            }
            selectFiles.push(file);
            $('previewGrid').appendChild(item);
            
        }
    }
    $('submitBtn').addEventListener('click',async () =>{
        $('submitBtn').disabled = true;
        $('submitBtn').innerText = "生成中...";
        uploadMultipleFiles(selectFiles);
    })
    async function uploadMultipleFiles(files){
        const formData = new FormData();
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        for (const file of files){
            formData.append('images',file)
        }
        const extraMessage = $('extraMessage').value;
        formData.append('extraMessage',extraMessage);
        if(urlParams.get('password')){
                $('submitBtn').innerText = "Pro mode";
                formData.append('password',urlParams.get('password'));
            }
        try {
            let text = "";
            let thought = "思考中...";
            let buffer = "";
            let directURL = '/api/start-chat';
            
            
            
            
            const response = await fetch(directURL,{
                method :"POST",
                body : formData
            });

            const reader = response.body.getReader();
            $('thinking-zone').style.display = "";
            decoder = new TextDecoder();
            while(true){
                const {done, value} = await reader.read();
                if (done) {
                    console.log("喔喔喔愛");
                    break;
                }
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = lines.pop();
                for(const line of lines){
                    if(!line.trim()) continue;
                    try {
                        msg = JSON.parse(line);
                
                    if (msg.status == "thinking"){
                        thought += msg.content;
                        
                    } else if (msg.status == "response") {
                        text += msg.content;
                        
                    } else if (msg.status == "usage") {
                        Object.entries(msg.content).forEach(([key,value]) => text += `${key}:${value} \n`)
                    } else {
                        console.log(msg);
                    }} catch (e) {
                        console.log(e);
                    }
                }
                MDRenderer.render('#thinking',thought);
                MDRenderer.render('#content',text);
                
                
            }
            
            $('submitBtn').disabled = false;
            $('submitBtn').innerText = "生成完成";
        } catch (err){
            console.log(err);
        }
        
    }
    $('extraMessage').addEventListener('input',function(){
        this.style.height = 'auto';
        this.style.height = this.scrollHeight +'px';
    })
</script>
