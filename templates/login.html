    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            :root {
                --bg: #e9ffff;
                --card:#ffffffca;
                --text: #1a1a1a;
                --muted:#848891;
                --border:#8b5f5f;
                --focus:#513535;
                --primary:#f99696;
                --primary-h:#ff0000;
            }
            *, *::before, *::after {
                box-sizing: border-box; /* 讓 padding 不會撐大寬度 */
                margin: 0;
                padding: 0;
            }
            body {
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: url('/static/images/bg.png');
                background-position: center;
                background-size: cover;
                
            }
            .card {
                background: var(--card);
                backdrop-filter: blur(12px);
                width: min(95%,420px);
                padding: 48px 40px;
                border-radius: 16px;
                box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.04),
                0px 8px 24px rgba(0, 0, 0, 0.078);
                
            }
            .card-header {
                text-align: center;
                margin-bottom: 32px;
            }
            .card-header h1 {
                font-size: 28px;
                font-weight: 700;
                letter-spacing: 0.04em;
                color: var(--text);
            }
            .card-header p {
                margin-top: 8px;
                font-size: 14px;
                color: var(--muted);
            }
            form {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
            .field {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            label {
                font-size: 13px;
                font-weight: 500;
                color: var(--muted);
                letter-spacing: 0.03em;
            }
            input {
                padding: 12px 14px;
                border: 1.5px solid var(--border);
                border-radius: 8px;
                font-size: 15px;
                color: var(--text);
                background: #fff;
                transition: border-color 0.2s, box-shadow 0.2s;
                outline: none;
            }
            input:focus {
                border-color: var(--focus);
                box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.12);
            }
            button {
                width: 100%;
                padding: 14px;
                color: #fff;
                margin-top: 4px;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 600;
                background: var(--primary);
                letter-spacing: 0.06em;
                cursor: pointer;
                transition: background 0.2s, transform 0.1s;
            }
            button:hover {
                background: var(--primary-h);
                transform: scale(1.02);
            }
            button:active {
                transform: scale(0.98);
            }
            .footer-text {
                margin-top: 20px;
                color: var(--muted);
                font-size: 13px;
            }
            .footer-text a {
                text-decoration: none;
                color: var(--primary);
                font-weight: 500;
            }
            .footer-text a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <form action="" method="post">
                <div class="card-header">
                    <h1>歡迎回來</h1>
                    <p>請輸入您的帳號資訊以繼續</p>
                </div>
                
                <div class="field">
                    <label for="username">帳號</label>
                    <input type="text" name="username" id="username">
                </div>
                <div class="field">
                    <label for="password">密碼</label>
                    <input type="text" name="password" id="password">
                </div>
                
                <button type="submit">登入</button>
                <p class="footer-text">還沒有帳號？<a href="#">立即註冊</a></p>
            </form>
        </div>
        
        
    </body>
    </html>
