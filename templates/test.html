<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billy是我兒子</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/static/js/marked_latex.js"></script>
    <style>
        :root {
            --primary-color:#0071E3;
        }
        *, ::before, ::after{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 64px;
            height: 100%;
            overflow-y: auto;
            background: #fcfcfc;
        }
        .nav-container {
            position: fixed;
            margin-top: 12px;
            top: 0px;
            z-index: 99999;
        }
        .segmented {
            display: flex;
            position: relative;
            background-color: #f7f7f761;
            backdrop-filter: blur(5px);
            color: rgba(151, 151, 151, 0.288);
            padding: 2px;
            border-radius: 980px;
            box-shadow: 0 16px 48px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.06);
            z-index: 99999;
        }
        .seg-pill {
            position: absolute;
            background-color: rgba(214, 214, 214, 0.683);
            border-radius: 980px;
            top: 2px; left: 2px;
            width: calc(50% - 2px);
            height: calc(100% - 4px);
            pointer-events: none;
            transition: all 0.28s ease;
        }
        .seg-btn {
            position: relative;
            z-index: 1;
            padding: 8px 24px;
            font-size: 18px;
            background: transparent;
            border: none;
            flex: 1;
            cursor: pointer;
            color: black;
        }
        .view {
            width: 100%;
            height: 100%;
            display: flex;
            width: min(90%,780px);
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <div class="segmented">
            <div class="seg-pill" id="pill"></div>
            <button class="seg-btn" onclick="switchTab(0)">對話</button>
            <button class="seg-btn" onclick="switchTab(1)">歷史</button>
        </div>
    </div>

    <div id="view-conversation" class="view">
        {% include '/components/conversation_view.html' %}
    </div>

    <div id="view-history" class="view" style="display: none;">
        {% include '/components/history_view.html' %}
        
    </div>
    <script>
        let $ = id => document.getElementById(id);
        let state = 'conversation';
        //切換狀態
        function switchTab(i){if(i == 0){state = "conversation";$('pill').style.transform = "";$('view-conversation').style.display = "flex";$('view-history').style.display = "none"; } else {state = "history";$('pill').style.transform = "translateX(100%)";$('view-conversation').style.display = "none";$('view-history').style.display = "flex";}}

    </script>
</body>
</html>
