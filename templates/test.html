<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billy是我兒子</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/static/js/marked_latex.js"></script>
    <style>
        *, ::before, ::after{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 64px;
            height: 100%;
            overflow-y: auto;
            background: #fcfcfc;
        }
        .nav-container {
            position: fixed;
            margin-top: 12px;
            top: 0px;

        }
        .segmented {
            display: flex;
            position: relative;
            background-color: #f7f7f7;
            color: rgb(94, 94, 94);
            padding: 2px;
            border-radius: 980px;
            box-shadow: 0 16px 48px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.06);
        }
        .seg-pill {
            position: absolute;
            background-color: rgb(212, 212, 212);
            border-radius: 980px;
            top: 2px; left: 2px;
            width: calc(50% - 2px);
            height: calc(100% - 4px);
            pointer-events: none;
            transition: all 0.28s ease;
        }
        .seg-btn {
            position: relative;
            z-index: 1;
            padding: 8px 24px;
            font-size: 18px;
            background: transparent;
            border: none;
            flex: 1;
            cursor: pointer;
            color: black;
        }
        .upload-zone {
            width: 100%;
            margin: 20px;
            padding: 40px 24px;
            border: #c3c3c3 solid 2px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .upload-zone p {
            font-size: 14px;
            padding: 14px;
        }
        .view {
            width: 100%;
            height: 100%;
            display: flex;
            width: min(90%,540px);
            flex-direction: column;
            align-items: center;
        }
        .md-area {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <div class="segmented">
            <div class="seg-pill" id="pill"></div>
            <button class="seg-btn" onclick="switchTab(0)">對話</button>
            <button class="seg-btn" onclick="switchTab(1)">歷史</button>
        </div>
    </div>

    <div id="view-conversation" class="view">
        <div class="upload-zone" id="drop-zone" onclick= "document.getElementById('fileInput').click()">
            <i class="fa-solid fa-upload"></i>
            <p>點擊上傳</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <div id="content" class="md-area"></div>
    </div>

    <div id="view-history" class="view" style="display: none;">
        <img src="/static/images/f.jpg" alt="分蚵仔">
    </div>
    <script>
        const $ = id => document.getElementById(id);
        let state = 'conversation';
        //切換狀態
        function switchTab(i){if(i == 0){state = "conversation";$('pill').style.transform = "";$('view-conversation').style.display = "flex";$('view-history').style.display = "none"; } else {state = "history";$('pill').style.transform = "translateX(100%)";$('view-conversation').style.display = "none";$('view-history').style.display = "flex";}}
        const markDownString = String.raw`

### 標題
- 第一項
- 第二項

### 馬克示威方程式總攬
$$\nabla \cdot \mathbf{E} = \frac{\rho}{\varepsilon_0}$$

$$\nabla \cdot \mathbf{B} = 0$$

$$\nabla \times \mathbf{E} = -\frac{\partial \mathbf{B}}{\partial t}$$

$$\nabla \times \mathbf{B} = \mu_0 \mathbf{J} + \mu_0 \varepsilon_0 \frac{\partial \mathbf{E}}{\partial t}$$


### 太ㄌㄨㄚˋ展開 
$$f(x) = \sum_{n=0}^{\infty} \frac{f^{(n)}(a)}{n!} (x-a)^n$$

展開後：

$$f(x) = f(a) + f'(a)(x-a) + \frac{f''(a)}{2!}(x-a)^2 + \frac{f'''(a)}{3!}(x-a)^3 + \dots + \frac{f^{(n)}(a)}{n!}(x-a)^n + R_n(x)$$
        `;
        MDRenderer.render('#content',markDownString)
    </script>
</body>
</html>
